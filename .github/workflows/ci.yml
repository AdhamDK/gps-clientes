name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 34
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper jar
        # gradle-wrapper.jar is not committed; generate on CI
        run: gradle wrapper --gradle-version 8.6

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Coverage (Kover/Jacoco)
        run: ./gradlew koverXmlReport || ./gradlew jacocoTestReport || echo "coverage task not configured"

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Instrumented tests (emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: ./gradlew connectedAndroidTest
