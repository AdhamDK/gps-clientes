[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self)"
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' https: data: blob:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; connect-src 'self' https: http://localhost:8000 https://script.google.com https://script.googleusercontent.com; font-src 'self' https: data:;"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Role = ["admin"]}
  force = false

# SPA fallback: all non-file paths to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  GAS_URL = "https://script.google.com/macros/s/AKfycbweLpc8AI2C4ouMY6AWrH6Voiemkoa4tlwc6qjyqeYIyIK1jGOvGdt_3YiNKKP6V6LsGA/exec"

